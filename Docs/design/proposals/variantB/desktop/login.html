</div>
<form class="space-y-space-md relative z-10" onsubmit="event.preventDefault();">
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md text-on-surface-variant text-left" for="email">E-Mail-Adresse</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline select-none pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-space-md bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg outline-none transition-all placeholder:text-outline-variant focus:bg-surface-container-high focus:shadow-[0_0_0_1px_#2dd4bf,0_0_16px_-2px_rgba(45,212,191,0.35)]" id="email" placeholder="name@beispiel.de" required="" type="email"/>
</div>

<label class="block font-label-md text-label-md text-on-surface-variant text-left" for="password">Passwort</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline select-none pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg outline-none transition-all placeholder:text-outline-variant focus:bg-surface-container-high focus:shadow-[0_0_0_1px_#2dd4bf,0_0_16px_-2px_rgba(45,212,191,0.35)]" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Passwort anzeigen" class="absolute right-space-md text-outline hover:text-primary transition-colors flex items-center justify-center p-1 focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-sm">
<button class="w-full h-12 rounded-lg bg-primary-container hover:bg-primary text-on-primary-container font-headline-md text-title-sm tracking-wide transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 hover:shadow-primary-container/40 hover:scale-[1.01] active:scale-[0.99] cursor-pointer" type="submit">

<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-space-lg pt-space-md text-center relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
            Noch kein Konto? 
            <a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed underline underline-offset-4 ml-1 transition-colors" href="#">
              Jetzt registrieren
            </a>
</p>

</div>
</div>

<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('passwordIcon');

    if (toggleBtn && passwordInput && passwordIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Passwort verbergen' : 'Passwort anzeigen');
      });
    }
  })();
</script></main></body></html>
