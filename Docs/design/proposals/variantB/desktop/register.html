.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-xs": "0.25rem", "margin-desktop": "2.5rem", "gutter-desktop": "1.75rem", "space-lg": "1.5rem", "margin": "1rem", "space-xl": "2.5rem", "space-sm": "0.5rem", "gutter": "1.25rem" }, "fontFamily": { "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-xl": ["Plus Jakarta Sans"], "label-sm": ["Inter"], "title-sm": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-lg": ["Inter"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Inter"] }, "fontSize": { "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["40px", { "lineHeight": "48px", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "600" }], "title-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-xl-mobile": ["30px", { "lineHeight": "38px", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }] } } } };</script></head><body class="min-h-screen bg-surface-container-lowest text-on-surface font-body-md text-body-md antialiased relative selection:bg-primary-container selection:text-on-primary-container"><div class="pointer-events-none fixed inset-0 overflow-hidden z-0"><div class="absolute -top-[20%] left-1/2 -translate-x-1/2 w-[720px] h-[520px] rounded-full bg-primary/10 blur-[140px]"></div><div class="absolute -bottom-[20%] right-[-10%] w-[640px] h-[480px] rounded-full bg-secondary-container/20 blur-[160px]"></div><div class="absolute top-1/3 left-[-15%] w-[500px] h-[400px] rounded-full bg-surface-tint/5 blur-[120px]"></div></div><main class="relative z-10 min-h-screen w-full flex flex-col justify-center items-center px-margin md:px-margin-desktop py-space-xl"><div class="flex flex-col w-full items-center justify-center relative">
<div class="w-full max-w-[460px] mx-auto flex flex-col items-center">
<!-- Central Card Shell -->
<div class="w-full rounded-xl bg-surface-container/70 backdrop-blur-xl shadow-2xl p-6 sm:p-8 relative overflow-hidden">
<!-- Ambient Backplate Accent -->
<div class="absolute -top-24 -right-24 w-60 h-60 rounded-full bg-primary/10 blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-60 h-60 rounded-full bg-secondary-container/20 blur-[80px] pointer-events-none"></div>
<!-- Header Section -->
<div class="flex flex-col items-center text-center relative z-10 mb-8">
<!-- Brand Icon Badge -->
<div class="w-12 h-12 rounded-xl bg-surface-container-high/80 flex items-center justify-center shadow-lg shadow-primary/5 mb-4 group transition-all duration-300">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<!-- Brand Typography -->
<div class="font-headline-md text-headline-md tracking-tight text-on-surface mb-2">
          Finance <span class="text-primary-container">Manager</span>
</div>
<!-- Headline & Subtitle -->
<h1 class="font-headline-lg text-headline-lg font-semibold text-on-surface tracking-tight">
          Konto erstellen
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 max-w-xs">
          Starten Sie mit Ihrem intelligenten Finanzmanager
        </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-4 relative z-10" onsubmit="event.preventDefault();">
<!-- Vollständiger Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium flex items-center justify-between" for="name-input">
<span>Vollständiger Name</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant transition-colors group-focus-within:text-primary">person</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-11 pr-4 py-3 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_1px_rgba(87,241,219,0.4)]" id="name-input" placeholder="Max Mustermann" required="" type="text"/>
</div>
</div>
<!-- E-Mail-Adresse -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium flex items-center justify-between" for="email-input">
<span>E-Mail-Adresse</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant transition-colors group-focus-within:text-primary">mail</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-11 pr-4 py-3 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_1px_rgba(87,241,219,0.4)]" id="email-input" placeholder="name@beispiel.de" required="" type="email"/>
</div>
</div>
<!-- Passwort -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium flex items-center justify-between" for="password-input">
<span>Passwort</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-11 pr-11 py-3 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_1px_rgba(87,241,219,0.4)]" id="password-input" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Passwort anzeigen oder ausblenden" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors p-1 flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Passwort bestätigen -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium flex items-center justify-between" for="confirm-password-input">
<span>Passwort bestätigen</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant transition-colors group-focus-within:text-primary">lock_reset</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-11 pr-11 py-3 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_1px_rgba(87,241,219,0.4)]" id="confirm-password-input" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Passwortbestätigung anzeigen oder ausblenden" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors p-1 flex items-center justify-center" id="toggle-confirm-password" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-6 rounded-lg bg-gradient-to-r from-primary via-primary-container to-primary-fixed-dim text-on-primary font-headline-md text-title-sm font-semibold flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 hover:shadow-primary-container/30 hover:brightness-105 active:scale-[0.99] transition-all duration-200 cursor-pointer" type="submit">
<span>Registrieren</span>
<span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Navigation -->
<div class="mt-6 pt-5 flex items-center justify-center relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
          Bereits registriert? 
          <a class="font-title-sm text-title-sm text-primary hover:text-primary-fixed transition-colors inline-flex items-center gap-0.5 ml-1 font-semibold underline-offset-4 hover:underline" href="#">
            Jetzt anmelden
          </a>
</p>
</div>
</div>
<!-- Trust / Security Footer Badge -->
<div class="mt-8 flex items-center justify-center gap-2 py-2 px-4 rounded-full bg-surface-container-low/70 backdrop-blur-md text-on-surface-variant shadow-sm">
<span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm tracking-widest font-semibold uppercase text-on-surface-variant">
        Ende-zu-Ende verschlüsselt · Bankenstandard
      </span>
</div>
</div>
</div>
<script>
  (function() {
    function setupToggle(toggleId, inputId) {
      const btn = document.getElementById(toggleId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;

      btn.addEventListener('click', () => {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        }
      });
    }

    setupToggle('toggle-password', 'password-input');
    setupToggle('toggle-confirm-password', 'confirm-password-input');
  })();
</script></main></body></html>
