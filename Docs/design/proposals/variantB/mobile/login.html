<div class="absolute -bottom-20 right-1/4 w-[28rem] h-[28rem] bg-gradient-to-br from-primary-container/20 to-secondary-container/25 rounded-full blur-[130px] pointer-events-none -z-10"></div>
<!-- Core Centered Authentication Card -->
<div class="w-full max-w-[440px] relative">
<!-- Outer Ambient Glow Contour -->
<div class="absolute -inset-0.5 rounded-xl bg-gradient-to-b from-primary-container/30 via-secondary/20 to-transparent blur-sm opacity-70 pointer-events-none"></div>

<!-- Brand Crest & Monogram -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="relative flex items-center justify-center w-14 h-14 rounded-xl bg-surface-container-highest shadow-xl mb-space-md group">

<!-- Bespoke Geometric Vector Emblem -->

<path class="opacity-90" d="M5 24V8L16 3L27 8V24L16 29L5 24Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M11 17L16 12L21 17" stroke="#d0bcff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>

</div>

</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">

<div class="flex flex-col gap-space-xs">

<span>E-Mail-Adresse</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px] pointer-events-none">

            </span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-inner focus:outline-none focus:ring-1 focus:ring-primary focus:shadow-[0_0_18px_rgba(45,212,191,0.25)] transition-all duration-200" id="email" name="email" placeholder="name@beispiel.de" required="" type="email">

<span class="relative z-10 flex items-center gap-2">

</button>

<span class="font-label-sm text-label-sm text-outline tracking-wider uppercase">Ende-zu-Ende verschlüsselt · Bankenstandard</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-wait');
    const originalText = btn.innerHTML;
    btn.innerHTML = `
      <span class="flex items-center gap-2 text-on-primary">
        <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Wird autorisiert...</span>
      </span>
    `;

    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-wait');
      btn.innerHTML = originalText;
    }, 1200);
  }
</script></main></body></html>
