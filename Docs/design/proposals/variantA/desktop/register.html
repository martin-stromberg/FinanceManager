<!DOCTYPE html>

<html class="dark" lang="de"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline-variant": "#444653", "secondary": "#c0c7d6", "surface-container-high": "#272a30", "secondary-container": "#404754", "error-container": "#93000a", "on-tertiary-fixed": "#2a1700", "tertiary-fixed-dim": "#ffb95d", "outline": "#8e909f", "on-error-container": "#ffdad6", "on-error": "#690005", "surface-container": "#1d2025", "secondary-fixed": "#dce2f3", "surface-dim": "#111319", "on-primary-container": "#002477", "surface-variant": "#32353b", "error": "#ffb4ab", "on-secondary": "#2a313d", "secondary-fixed-dim": "#c0c7d6", "on-primary": "#002780", "surface-container-lowest": "#0b0e13", "primary-fixed-dim": "#b6c4ff", "surface-bright": "#36393f", "surface-tint": "#b6c4ff", "on-tertiary-fixed-variant": "#653e00", "inverse-on-surface": "#2e3036", "on-tertiary-container": "#422700", "tertiary-container": "#ce8400", "on-background": "#e1e2ea", "on-surface-variant": "#c4c5d5", "background": "#111319", "surface": "#111319", "inverse-primary": "#3255c5", "on-secondary-container": "#aeb5c5", "on-secondary-fixed-variant": "#404754", "surface-container-low": "#191c21", "surface-container-highest": "#32353b", "primary-container": "#6d8dff", "primary-fixed": "#dce1ff", "on-primary-fixed": "#001550", "on-surface": "#e1e2ea", "on-tertiary": "#462a00", "inverse-surface": "#e1e2ea", "primary": "#b6c4ff", "on-primary-fixed-variant": "#0d3bac", "tertiary-fixed": "#ffddb7", "tertiary": "#ffb95d", "on-secondary-fixed": "#151c27" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "margin-mobile": "1rem", "gutter-mobile": "0.75rem", "space-xl": "2rem", "gutter": "1.25rem", "space-md": "0.75rem", "space-lg": "1.25rem" }, "fontFamily": { "label-sm": ["Inter"], "data-mono-sm": ["JetBrains Mono"], "body-md": ["Inter"], "label-md": ["Inter"], "headline-lg-mobile": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "data-mono-lg": ["JetBrains Mono"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "data-mono-md": ["JetBrains Mono"], "body-lg": ["Inter"], "headline-xl": ["Inter"], "headline-xl-mobile": ["Inter"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "data-mono-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg-mobile": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-sm": ["15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "headline-md": ["18px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "data-mono-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "data-mono-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md min-h-screen flex flex-col justify-center items-center"><main class="flex flex-col relative w-full max-w-md mx-auto px-margin-mobile pt-safe pb-safe bg-surface-container-lowest justify-center items-center min-h-screen"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-space-lg text-center">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-high shadow-md mb-space-sm">
<span class="material-symbols-outlined text-primary text-[26px]">account_balance_wallet</span>
</div>
<div class="flex items-center gap-1.5">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">FinanceManager</span>
<span class="font-data-mono-sm text-data-mono-sm text-primary bg-primary/10 px-1.5 py-0.5 rounded">ID</span>
</div>
</div>
<!-- Registration Card -->
<div class="w-full bg-surface-container-low rounded-lg p-space-lg shadow-xl relative overflow-hidden">
<!-- Subtle Ambient Top Light -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-1 bg-primary-container/20 blur-[2px] rounded-full"></div>
<div class="mb-space-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Registrierung</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Erstellen Sie Ihren Zugang zur Finanzplattform</p>
</div>
<form class="flex flex-col gap-space-md" id="registrationForm" onsubmit="event.preventDefault(); validateForm();">
<!-- Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="name">Name</label>
<div class="relative flex items-center">
<input autocomplete="name" class="w-full h-10 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg outline-none transition-all duration-200 focus:bg-surface-container" id="name" name="name" placeholder="Max Mustermann" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-Mail</label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-10 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg outline-none transition-all duration-200 focus:bg-surface-container" id="email" name="email" placeholder="name@beispiel.de" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Passwort</label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-10 pl-3 pr-10 bg-surface-container-lowest text-on-surface font-data-mono-md text-data-mono-md placeholder:text-outline rounded-lg outline-none transition-all duration-200 focus:bg-surface-container" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Passwort anzeigen" class="absolute right-2.5 p-1 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" tabindex="-1" type="button">
<span class="material-symbols-outlined text-[18px]" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Password Confirmation Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="password_confirm">Passwort bestätigen</label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-10 pl-3 pr-10 bg-surface-container-lowest text-on-surface font-data-mono-md text-data-mono-md placeholder:text-outline rounded-lg outline-none transition-all duration-200 focus:bg-surface-container" id="password_confirm" name="password_confirm" placeholder="••••••••" required="" type="password"/>
<button aria-label="Passwortbestätigung anzeigen" class="absolute right-2.5 p-1 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePasswordVisibility('password_confirm', 'confirmToggleIcon')" tabindex="-1" type="button">
<span class="material-symbols-outlined text-[18px]" id="confirmToggleIcon">visibility</span>
</button>
</div>
<p class="hidden font-label-sm text-label-sm text-error mt-0.5" id="passwordMismatch">Die Passwörter stimmen nicht überein.</p>
</div>
<!-- Primary Action Button -->
<div class="pt-space-sm mt-1">
<button class="w-full h-11 bg-primary-container hover:bg-[#5b7cef] active:scale-[0.99] text-on-primary-fixed font-headline-sm text-headline-sm rounded-lg shadow-sm transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer font-semibold" id="submitBtn" type="submit">
<span>Registrieren</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Sign In Alternative Link -->
<div class="mt-space-lg pt-space-md bg-surface-container-low text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        Bereits ein Konto?
        <a class="text-primary hover:text-primary-fixed-dim transition-colors font-medium ml-1 inline-flex items-center" href="#anmelden">
          Jetzt anmelden
        </a>
</p>
</div>
</div>
<!-- Trust / Institutional Security Subtext -->
<div class="flex items-center gap-2 mt-space-lg text-outline">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase">Ende-zu-Ende Verschlüsselung</span>
</div>
</div>
<script>
  function togglePasswordVisibility(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (!field || !icon) return;
    
    if (field.type === 'password') {
      field.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      field.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function validateForm() {
    const pwd = document.getElementById('password');
    const confirm = document.getElementById('password_confirm');
    const mismatchMsg = document.getElementById('passwordMismatch');
    const submitBtn = document.getElementById('submitBtn');

    if (pwd.value !== confirm.value) {
      mismatchMsg.classList.remove('hidden');
      confirm.focus();
      return;
    } else {
      mismatchMsg.classList.add('hidden');
    }

    // Interactive button feedback
    const originalContent = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
      <span>Wird erstellt...</span>
    `;

    setTimeout(() => {
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-[18px]">check_circle</span>
        <span>Erfolgreich!</span>
      `;
      submitBtn.classList.remove('bg-primary-container', 'hover:bg-[#5b7cef]');
      submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
    }, 1200);
  }
</script></main></body></html>
