/* --- canonical chrome injected by rework-proposals.py --- */
.fm-aside{position:fixed;left:0;top:0;bottom:0;width:232px;display:flex;flex-direction:column;
  background:var(--fm-bg2);border-right:1px solid var(--fm-border);z-index:60}
.fm-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--fm-border)}
.fm-logo{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fm-brand-name{display:block;font-weight:600;font-size:15px;color:var(--fm-text);letter-spacing:-.01em}
.fm-brand-sub{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fm-muted)}
.fm-nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.fm-nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
  color:var(--fm-muted);font-size:13px;text-decoration:none}
.fm-nav a .material-symbols-outlined{font-size:19px;width:20px;text-align:center}
.fm-nav a.active{background:var(--fm-active);color:var(--fm-accent);font-weight:600}
.fm-nav a:hover{background:var(--fm-hover);color:var(--fm-text)}
.fm-nav-sep{height:1px;background:var(--fm-border);margin:8px 10px}
.fm-topbar{position:fixed;top:0;left:232px;right:0;height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;background:var(--fm-bg2);border-bottom:1px solid var(--fm-border);z-index:50}
.fm-page-title{font-size:15px;font-weight:600;color:var(--fm-text);letter-spacing:-.01em}
.fm-avatar{width:30px;height:30px;border-radius:50%;background:var(--fm-accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.fm-ribbon{position:fixed;top:52px;left:232px;right:0;display:flex;gap:14px;align-items:stretch;
  padding:8px 24px;background:var(--fm-bg3);border-bottom:1px solid var(--fm-border);z-index:40;
  overflow-x:auto;min-height:58px}
.fm-rib-group{display:flex;flex-direction:column}
.fm-rib-group-body{display:flex;gap:4px;align-items:stretch;flex:1}
.fm-rib-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:60px;padding:5px 10px;border:none;border-radius:7px;background:transparent;
  color:var(--fm-text);font-size:11px;cursor:default}
.fm-rib-btn .material-symbols-outlined{font-size:20px}
.fm-rib-btn.primary{background:var(--fm-accent);color:#fff}
.fm-rib-caption{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fm-muted);
  text-align:center;border-top:1px solid var(--fm-border);padding-top:2px;margin-top:2px}
.fm-info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;background:var(--fm-bg3);border:1px solid var(--fm-border);cursor:help;
  color:var(--fm-muted);vertical-align:middle}
.fm-info .material-symbols-outlined{font-size:13px}
body{margin:0;padding-left:232px;padding-top:110px;background:var(--fm-bg);color:var(--fm-text)}
/* Variant B (icon rail) */
.fm-aside-b{width:72px;align-items:center}
.fm-aside-b .fm-brand{padding:14px 0;flex-direction:column;gap:4px}
.fm-aside-b .fm-brand-text{display:none}
.fm-aside-b .fm-brand-sub{display:none}

.fm-topbar-b{left:72px}

.fm-ribbon-b .fm-rib-group{background:var(--fm-bg3);border:1px solid var(--fm-border);border-radius:14px;padding:6px 10px}
.fm-ribbon-b .fm-rib-btn{min-width:0;padding:4px 9px}
body.fm-body-b{padding-left:72px;padding-top:124px}
/* mobile */
.fm-aside-m{display:none}
body.fm-body-m{padding-left:0;padding-top:108px}
.fm-topbar-m{left:0}
.fm-ribbon-m{left:0;top:56px}

</style><style>:root{--fm-bg:#0b0e13;--fm-bg2:#10131a;--fm-bg3:#151922;--fm-border:#232a36;--fm-text:#e1e2ea;--fm-muted:#8e9aa8;--fm-accent:#6d8dff;--fm-active:#1c2333;--fm-hover:#171c26}body{font-family:'Inter',system-ui,sans-serif}</style></head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container fm-body-a"><header class="fm-topbar" style="left:0"><div style="display:flex;align-items:center;gap:10px"><span class="fm-logo" style="background:#1c2333;color:#6d8dff"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="12" width="4.5" height="8" rx="1" fill="currentColor"></rect><rect x="10" y="7" width="4.5" height="13" rx="1" fill="currentColor" opacity=".75"></rect><rect x="17" y="3" width="4.5" height="17" rx="1" fill="currentColor" opacity=".5"></rect></svg></span><span class="fm-page-title">FinanceManager</span></div></header><main class="min-h-screen w-full flex items-center justify-center p-margin-desktop bg-surface-container-lowest"><div class="flex flex-col w-full items-center justify-center">
<!-- Subtle ambient radial gradient behind the card -->
<div class="relative w-full max-w-[440px] flex flex-col items-center">
<div class="absolute -inset-1 rounded-2xl bg-gradient-to-b from-primary-container/10 via-transparent to-transparent blur-xl pointer-events-none -z-10"></div>
<!-- Centered Login Card -->
<div class="w-full bg-[#10131a] rounded-[10px] p-8 md:p-10 shadow-2xl relative overflow-hidden" style="border: 1px solid #232a36; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);">
<!-- Top Accent Line -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#6d8dff] to-transparent opacity-80"></div>
<!-- Header: FinanceManager Logo & Branding -->
<div class="flex flex-col items-center text-center mb-8">
<div class="flex items-center gap-3 mb-5 group cursor-default">
<div class="w-10 h-10 rounded-[10px] bg-[#161b24] flex items-center justify-center shadow-inner transition-transform duration-300 group-hover:scale-105" style="border: 1px solid #232a36;">
<!-- Brand Icon (Finance Growth Vector) -->
<svg class="w-5 h-5 text-primary-container" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
<polyline points="16 7 22 7 22 13"></polyline>
</svg>
</div>
<div class="flex items-baseline tracking-tight font-headline-md text-headline-md">
<span class="text-white font-semibold">Finance</span><span class="text-[#6d8dff] font-bold">Manager</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-[#f3f4f6] tracking-tight">
          Anmeldung
        </h1>
<p class="font-body-sm text-body-sm text-[#9ca3af] mt-1.5">
          Geben Sie Ihre Zugangsdaten ein, um fortzufahren.
        </p>
</div>
<!-- Login Form -->
<form class="flex flex-col space-y-5" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- E-Mail Input -->
<div class="flex flex-col space-y-2">
<label class="font-body-md text-body-md font-medium text-[#f3f4f6]" for="email">
            E-Mail-Adresse
          </label>
<div class="relative">
<input autocomplete="email" class="w-full h-11 px-3.5 bg-[#161b24] text-[#f3f4f6] placeholder-[#4b5563] text-body-md font-body-md rounded-[8px] outline-none transition-all duration-200" id="email" name="email" onblur="this.style.borderColor='#232a36'; this.style.boxShadow='none';" onfocus="this.style.borderColor='#6d8dff'; this.style.boxShadow='0 0 0 3px rgba(109, 141, 255, 0.2)';" placeholder="name@beispiel.de" required="" style="border: 1px solid #232a36;" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-2">
<div class="flex items-center justify-between">
<label class="font-body-md text-body-md font-medium text-[#f3f4f6]" for="password">
              Passwort
            </label>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-11 px-3.5 pr-11 bg-[#161b24] text-[#f3f4f6] placeholder-[#4b5563] text-body-md font-body-md rounded-[8px] outline-none transition-all duration-200" id="password" name="password" onblur="this.style.borderColor='#232a36'; this.style.boxShadow='none';" onfocus="this.style.borderColor='#6d8dff'; this.style.boxShadow='0 0 0 3px rgba(109, 141, 255, 0.2)';" placeholder="••••••••" required="" style="border: 1px solid #232a36;" type="password">
<button aria-label="Passwort anzeigen oder ausblenden" class="absolute right-3 text-[#9ca3af] hover:text-[#f3f4f6] transition-colors p-1 flex items-center justify-center focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[19px]" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-11 bg-primary-container hover:bg-[#5777eb] active:scale-[0.985] text-white font-headline-sm text-headline-sm rounded-[8px] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer shadow-md" id="submitBtn" type="submit">
<span>Anmelden</span>
</button>
</div>
</form>
<!-- Registration Redirect -->
<div class="mt-8 pt-5 text-center" style="border-top: 1px solid #1c222c;">
<p class="font-body-md text-body-md text-[#9ca3af]">
          Noch kein Konto?
          <a class="text-[#6d8dff] hover:text-[#91aaff] font-medium ml-1 transition-colors underline-offset-4 hover:underline" href="#register">
            Jetzt registrieren
          </a>
</p>
</div>
</div>
<!-- Security & Institutional Micro-Footer -->
<div class="mt-6 flex items-center gap-2 text-center text-[#6b7280] font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>256-Bit SSL-gesicherte Übertragung</span>
</div>
</div>
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const icon = document.getElementById('passwordToggleIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleLogin() {
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span><span class="ml-2">Wird überprüft...</span>';
      btn.disabled = true;
      btn.style.opacity = '0.85';

      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.style.opacity = '1';
      }, 1000);
    }
  </script>
</div></main></body></html>
