<div class="absolute -bottom-16 -left-16 w-36 h-36 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>

        Anmeldung
      </h1>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- E-Mail Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">
            E-Mail
          </label>
<div class="relative">
<input class="w-full h-10 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg focus:outline-none focus:ring-1 focus:ring-primary-container transition-all" id="email" name="email" placeholder="name@beispiel.de" required="" type="email"/>
</div>
</div>
<!-- Passwort Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
            Passwort
          </label>
<div class="relative">
<input class="w-full h-10 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg focus:outline-none focus:ring-1 focus:ring-primary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary CTA Button -->
<button class="w-full mt-space-sm h-10 bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold rounded-lg flex items-center justify-center active:scale-[0.99] transition-transform duration-75 shadow-sm" type="submit">
          Anmelden
        </button>
</form>
<!-- Registration Link -->
<div class="mt-space-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
          Noch kein Konto?

            Jetzt registrieren
          </a>
</p>
</div>
</div>
