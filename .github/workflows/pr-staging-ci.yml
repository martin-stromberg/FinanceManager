name: PR CI for Staging

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    # Most thorough variant across the projects (ci-inventory.md section 8/10, decision 20):
    # checks both whether main's tip is a merge-parent of this PR's merge commit, and whether
    # the resulting tree is identical to main. actions/checkout on a pull_request event checks
    # out the synthetic merge commit (base + head), so "origin/main is a parent of HEAD" is a
    # direct, reliable signal that this PR's head branch is exactly main's current tip - i.e.
    # the automated back-merge PR created by sync-staging-with-main.yml.
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this PR is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # Hybrid job model (ci-target-schema.md section 4.2, decision 18): runs in parallel with
    # build-and-test, with no `needs:` between them, so a format/security/lint failure is
    # visible within seconds instead of waiting for the multi-minute test run to finish.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceManager.sln
        shell: pwsh

      - name: Format check
        # Gate 1
        run: dotnet format FinanceManager.sln --verify-no-changes --no-restore
        shell: pwsh

      - name: Security scan
        # Gate 2 - shared composite action, see .github/actions/security-scan.
        uses: ./.github/actions/security-scan
        with:
          solution-path: FinanceManager.sln
          artifact-name: vulnerable-packages-pr

      - name: Static analysis
        # Gate 3. WarningsNotAsErrors excludes pre-existing xUnit-analyzer/test-style warnings
        # (confirmed via a real CI run on this branch: 1287x xUnit1051, plus xUnit2000/2009/
        # 2012/2013/2029/2031, xUnit1031, NU1510, BL0005 - all confined to the test projects)
        # that predate this migration and are out of safe scope to bulk-fix here. Anything
        # else still fails the build.
        run: dotnet build FinanceManager.sln -c Debug --no-restore "-p:TreatWarningsAsErrors=true" "-p:WarningsNotAsErrors=xUnit1051%3BxUnit2000%3BxUnit2009%3BxUnit2012%3BxUnit2013%3BxUnit2029%3BxUnit2031%3BxUnit1031%3BNU1510%3BBL0005"
        shell: pwsh

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Restore dependencies
        run: dotnet restore
        shell: pwsh

      - name: Build
        run: |
          dotnet build FinanceManager.Tests/FinanceManager.Tests.csproj --no-restore -c Debug
          dotnet build FinanceManager.Tests.E2E/FinanceManager.Tests.E2E.csproj --no-restore -c Debug
          dotnet build FinanceManager.Tests.Integration/FinanceManager.Tests.Integration.csproj --no-restore -c Debug
        shell: pwsh

      - name: Test regular tests
        # Gate 4 (blocking): collects coverage, since this is the blocking test category that
        # feeds the coverage threshold below (ci-target-schema.md section 4.5). The
        # Category!=OsInterface filter mirrors Softwareschmiede's OS-interface split for
        # forward compatibility, even though no test in this project is currently tagged
        # Category=OsInterface - real OS-interface-style isolation here is the separate,
        # continue-on-error E2E project below.
        run: dotnet test FinanceManager.Tests/FinanceManager.Tests.csproj --no-build -c Debug --filter "Category!=OsInterface" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-regular-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test regular integration
        run: dotnet test FinanceManager.Tests.Integration/FinanceManager.Tests.Integration.csproj --no-build -c Debug --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-regular-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test E2E tests
        # Best-effort: E2E/browser-driven tests are not always reliable on GitHub-hosted
        # runners. Results are uploaded separately but don't block PRs, matching the
        # OsInterface best-effort pattern used across the other projects.
        continue-on-error: true
        run: dotnet test FinanceManager.Tests.E2E/FinanceManager.Tests.E2E.csproj --no-build -c Debug --logger "trx;LogFileName=test-results-e2e-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11
        shell: pwsh

      - name: Generate coverage report
        run: reportgenerator "-reports:FinanceManager.Tests/TestResults/**/coverage.cobertura.xml;FinanceManager.Tests.Integration/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"
        shell: pwsh

      - name: Enforce coverage threshold
        # Gate 5: hard 70% line-coverage minimum (ci-target-schema.md section 4.5).
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          $summary = Get-Content coverage-report/Summary.txt -Raw
          if ($summary -notmatch "Line coverage:\s*([\d.,]+)%") {
            throw "Could not determine line coverage from the generated report."
          }
          $lineCoverage = [double]($matches[1] -replace ',', '.')
          $threshold = [double]$env:COVERAGE_THRESHOLD
          Write-Host "Line coverage: $lineCoverage% (threshold: $threshold%)"
          if ($lineCoverage -lt $threshold) {
            throw "Code coverage $lineCoverage% is below the required threshold of $threshold%."
          }
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-pr
          path: coverage-report/
          retention-days: 14

      - name: Upload regular test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-regular-pr
          path: |
            FinanceManager.Tests/TestResults/*regular*.trx
            FinanceManager.Tests.Integration/TestResults/*regular*.trx
          retention-days: 14

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e-pr
          path: |
            FinanceManager.Tests.E2E/TestResults/*e2e*.trx
          retention-days: 14

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "Back-merge PR from main detected. Redundant checks are skipped."
